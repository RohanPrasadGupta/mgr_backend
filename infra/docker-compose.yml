name: moneymgr
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moneymgr
      POSTGRES_PASSWORD: moneymgr
      POSTGRES_DB: moneymgr
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneymgr"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: moneymgr
      MINIO_ROOT_PASSWORD: moneymgr-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
volumes:
  pgdata:
  miniodata:
